name: CI

on:
  pull_request:
    branches: [main]

jobs:
  version-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Check plugin version bumps
        run: ./bin/check-version "${{ github.event.pull_request.base.sha }}"
